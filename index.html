<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Queue Statistics Widget - Demo</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background: #eef0f4;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      /* Mimics a crowded Agent Desktop header bar - the widget has to
         share this row with several other icon-sized widgets. */
      .fake-header {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 44px;
        padding: 0 12px;
        background: #1f2430;
      }
      .fake-icon {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.15);
        flex-shrink: 0;
      }
      #widget-root {
        position: relative;
      }
      .fake-body {
        padding: 24px;
        color: #888;
        font-size: 13px;
      }
    </style>
    <script type="module" src="/src/demo.ts"></script>
  </head>
  <body>
    <div class="fake-header">
      <div class="fake-icon"></div>
      <div class="fake-icon"></div>
      <div id="widget-root"></div>
      <div class="fake-icon"></div>
      <div class="fake-icon"></div>
      <div class="fake-icon"></div>
    </div>
    <div class="fake-body">Rest of Agent Desktop (for scale reference only)</div>
  </body>
</html>
